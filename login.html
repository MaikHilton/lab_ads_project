<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Вхід</title>
</head>
<body>
  <h1>Вхід</h1>
  <form id="loginForm">
    <input type="email" id="email" placeholder="Email" required><br><br>
    <input type="password" id="password" placeholder="Пароль" required><br><br>
    <button type="submit">Увійти</button>
  </form>
  <p id="message" style="color: red;"></p>
  <p>Немає акаунта? <a href="/register.html">Зареєструватися</a></p>

  <script>
    const API_URL = 'http://localhost:3000';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const body = {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      };

      const response = await fetch(`${API_URL}/api/auth/login`, {
        method: 'POST',
        credentials: 'include', // ОБОВ'ЯЗКОВО для роботи з cookies
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      const data = await response.json();

      if (!response.ok) {
        document.getElementById('message').textContent = data.message;
        return;
      }

      window.location.href = '/index.html'; // Більше ніякого localStorage!
    });
  </script>
</body>
</html>
